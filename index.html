<style>
  *{box-sizing:border-box}

  .rbox{height:20px;border-top:1px dashed #cbd5e1;margin-top:5px}

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
/* ============================================================
   ▼▼▼  대회 설정 (이미 입력됨)  ▼▼▼
============================================================ */
const SUPABASE_URL      = "https://pxjqcaulmogjlbfheyqk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4anFjYXVsbW9namxiZmhleXFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyODAzNzQsImV4cCI6MjEwMzg1NjM3NH0.kwJy4ElDY_4zpPKa7E-6pGB_Cf-SbdizDXyA58Jxguw";
const ADMIN_PW          = "seoulfire";   // 운영진 화면 비밀번호
/* ============================================================ */

const { useState, useEffect } = React;
const EVENTS = [["single","단식"],["double","복식"],["team","단체전"]];
const EVLABEL = Object.fromEntries(EVENTS);
const DIVS = ["1부","2부","3부","4부","5부","6부"];

/* ---------- 대진 계산 엔진 ---------- */
function tierOf(map,d){return (map&&map[d])?map[d]:d;}
function makeGroups(entries, size, tierMap){
  const byTier={}; entries.forEach(p=>{const t=tierOf(tierMap,p.div||"1부");(byTier[t]=byTier[t]||[]).push(p);});
  const gnum=s=>{const m=String(s).match(/\d+/);return m?+m[0]:99;};
  const tiers=Object.keys(byTier).sort((A,B)=>gnum(A)-gnum(B));
  const groups=[]; let idx=0;
  tiers.forEach(t=>{
    const list=[...byTier[t]];
    for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
    for(let i=0;i<list.length;i+=size)
      groups.push({id:`g_${t}_${i}`,name:`${String.fromCharCode(65+idx++)}조`,div:t,members:list.slice(i,i+size).map(p=>p.id)});
  });
  return groups;
}
function roundRobin(ids){const r=[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)r.push([ids[i],ids[j]]);return r;}
const pKey=(g,a,b)=>`${g}|${[a,b].sort().join("~")}`;
function standings(g,prelim){
  const rec={}; g.members.forEach(m=>rec[m]={id:m,win:0,loss:0,played:0});
  roundRobin(g.members).forEach(([a,b])=>{const w=prelim[pKey(g.id,a,b)];if(w){rec[a].played++;rec[b].played++;const l=w===a?b:a;if(rec[w])rec[w].win++;if(rec[l])rec[l].loss++;}});
  return Object.values(rec).sort((x,y)=>y.win-x.win||y.played-x.played);
}
const nextPow2=n=>{let p=1;while(p<n)p*=2;return Math.max(p,1);};
function seedPositions(n){let pols=[1,2];while(pols.length<n){const s=pols.length*2+1;const o=[];for(const p of pols){o.push(p);o.push(s-p);}pols=o;}return pols;}
function matchWinner(m,w){if(m.a&&!m.b)return m.a;if(m.b&&!m.a)return m.b;if(!m.a||!m.b)return null;const id=w[m.id];if(m.a&&id===m.a.id)return m.a;if(m.b&&id===m.b.id)return m.b;return null;}
function buildRounds(seeds,winners){
  if(seeds.length<2)return[];
  const size=nextPow2(seeds.length),pos=seedPositions(size),slots=pos.map(p=>seeds[p-1]||null);
  const rounds=[];let r0=[];for(let i=0;i<size;i+=2)r0.push({id:`r0m${i/2}`,a:slots[i],b:slots[i+1]});rounds.push(r0);
  let r=0;
  while(rounds[r].length>1){const prev=rounds[r],nx=[];for(let i=0;i<prev.length;i+=2)nx.push({id:`r${r+1}m${i/2}`,a:matchWinner(prev[i],winners),b:matchWinner(prev[i+1],winners)});rounds.push(nx);r++;}
  return rounds;
}
const roundName=(i,t)=>{const e=t-i;return e===1?"결승":e===2?"준결승":e===3?"8강":e===4?"16강":`${i+1}라운드`;};
const divsOf=st=>{const s=[];(st.groups||[]).forEach(g=>{if(!s.includes(g.div))s.push(g.div);});return s;};
function advancersOf(st,div,byId){
  const gs=(st.groups||[]).filter(g=>g.div===div),adv=st.advance||2,pr=st.prelim||{},seeds=[];
  for(let r=0;r<adv;r++)gs.forEach(g=>{const s=standings(g,pr)[r];if(s&&byId[s.id])seeds.push(byId[s.id]);});
  return seeds;
}

/* ---------- Supabase ---------- */
const configured = !SUPABASE_URL.includes("YOUR-") && !SUPABASE_ANON_KEY.includes("YOUR-");
let sb=null; try{ if(configured) sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);}catch(e){}
async function fetchAll(){
  const {data:ent}=await sb.from('entries').select('*').order('created_at');
  const {data:ts}=await sb.from('tstate').select('*');
  const states={}; (ts||[]).forEach(r=>states[r.event]=r.data||{});
  return {entries:ent||[],states};
}
const saveState=(event,data)=>sb.from('tstate').upsert({event,data,updated_at:new Date().toISOString()});
const addEntry   =row=>sb.from('entries').insert(row);
const updateEntry=(id,patch)=>sb.from('entries').update(patch).eq('id',id);
const deleteEntry=id=>sb.from('entries').delete().eq('id',id);

/* ---------- 예선 교차표 ---------- */
function Matrix({group,prelim,byId,adv,onSet,readOnly}){
  const members=group.members.map(id=>byId[id]).filter(Boolean);
  const st=standings(group,prelim);
  const rankOf=id=>st.findIndex(s=>s.id===id)+1;
  const rec=id=>st.find(s=>s.id===id)||{win:0,loss:0,played:0};
  const res=(a,b)=>{const w=prelim[pKey(group.id,a,b)];return !w?"":w===a?"W":"L";};
  return (<>
    <table className="mx">
      <thead><tr>
        <th className="corner">{group.name}<br/>{group.div}</th>
        {members.map(m=><th className="mx-h" key={m.id}>{m.name}<span>{m.org||""}</span></th>)}
        <th>승-패</th><th>순위</th>
      </tr></thead>
      <tbody>
        {members.map(rp=>{const r=rec(rp.id),rk=rankOf(rp.id),a=rk<=adv;
          return <tr key={rp.id}>
            <th className="mx-rh">{rp.name}<span>{rp.org||""}</span></th>
            {members.map(cp=>{
              if(rp.id===cp.id)return <td className="mx-diag" key={cp.id}></td>;
              const v=res(rp.id,cp.id);
              return <td key={cp.id} className={"mx-c "+(readOnly?"ro ":"")+(v==="W"?"mx-w":v==="L"?"mx-l":"")}
                onClick={()=>!readOnly&&onSet(group.id,rp.id,cp.id)}>{v==="W"?"승":v==="L"?"패":(readOnly?"":"·")}</td>;
            })}
            <td>{r.win}-{r.loss}</td>
            <td className={"mx-r "+(a&&r.played?"mx-adv":"")}>{r.played?rk:"-"}</td>
          </tr>;})}
      </tbody>
    </table>
    <p className="mx-cap">칸을 누르면 가로줄 선수의 '승'으로 기록됩니다. 다시 누르면 취소. ▲순위 {adv}위까지 본선 진출.</p>
  </>);
}

/* ---------- 본선 대진표 ---------- */
function Bracket({rounds,winners,onPick,readOnly}){
  const t=rounds.length, champ=matchWinner(rounds[t-1][0],winners);
  return (<div className="scroll"><div className="brk">
    {rounds.map((round,ri)=>(
      <div className="brk-col" key={ri}><p>{roundName(ri,t)}</p>
        {round.map(m=>{const w=matchWinner(m,winners);
          const Side=({pl})=>(<button disabled={readOnly||!pl} className={w&&pl&&w.id===pl.id?"w":""}
            onClick={()=>pl&&onPick&&onPick(m.id,pl.id)}>{pl?pl.name:<span className="muted">부전승</span>}</button>);
          return <div className="brk-m" key={m.id}><Side pl={m.a}/><Side pl={m.b}/></div>;})}
      </div>))}
    {champ&&<div style={{display:"flex",flexDirection:"column",justifyContent:"center"}}><p style={{fontSize:12,color:"#94a3b8",textAlign:"center"}}>우승</p><div className="champ">🏆 {champ.name}</div></div>}
  </div></div>);
}

/* ---------- 예선 결과지(출력) ---------- */
function PrelimSheet({state,byId,evLabel}){
  const groups=state.groups||[];
  if(!groups.length)return <p className="muted">조 편성 후 출력할 수 있습니다.</p>;
  return <div>{groups.map(g=>{
    const members=g.members.map(id=>byId[id]).filter(Boolean);
    return <div className="sheet" key={g.id}>
      <div className="sheet-h">
        <div className="sheet-g">{g.name}</div>
        <div className="sheet-t">{evLabel} · {g.div} 예선 결과지<small>각 칸에 이긴 게임(세트) 수를 적으세요. 동점 시 득·실로 순위를 판정합니다.</small></div>
        <div className="sheet-tb">탁구대<br/>______</div>
      </div>
      <table className="pmx">
        <thead><tr>
          <th className="corner"></th>
          {members.map(m=><th className="ph" key={m.id}>{m.name}<small>{m.org||""}</small></th>)}
          <th className="sum">승점</th><th className="sum">득·실</th><th className="sum">순위</th>
        </tr></thead>
        <tbody>
          {members.map(rp=>(<tr key={rp.id}>
            <th className="rh">{rp.name}</th>
            {members.map(cp=> rp.id===cp.id
              ? <td className="diag" key={cp.id}></td>
              : <td className="cellw" key={cp.id}></td>)}
            <td className="sum"></td><td className="sum"></td><td className="sum"></td>
          </tr>))}
        </tbody>
      </table>
    </div>;
  })}</div>;
}

/* ---------- 참가 신청 ---------- */
function Register({entries,reload}){
  const [ev,setEv]=useState("single"),[dv,setDv]=useState("1부");
  const [name,setName]=useState(""),[org,setOrg]=useState(""),[phone,setPhone]=useState("");
  const [p1,setP1]=useState({name:"",org:"",div:"1부",phone:""});
  const [p2,setP2]=useState({name:"",org:"",div:"1부",phone:""});
  const [team,setTeam]=useState({name:"",div:"1부",phone:""});
  const [r,setR]=useState([{name:"",div:"1부"},{name:"",div:"1부"},{name:"",div:"1부"}]);
  const [msg,setMsg]=useState(null),[busy,setBusy]=useState(false);
  const [qn,setQn]=useState(""),[qp,setQp]=useState("");
  const num=d=>parseInt(d)||0;
  const submit=async()=>{
    let row=null;
    if(ev==="single"){
      if(!name.trim())return setMsg(["no","이름을 입력하세요."]);
      if(!phone.trim())return setMsg(["no","연락처를 입력하세요."]);
      row={event:"single",name:name.trim(),org:org.trim(),div:dv,phone:phone.trim(),meta:{}};
    }else if(ev==="double"){
      if(!p1.name.trim()||!p2.name.trim())return setMsg(["no","두 선수 이름을 입력하세요."]);
      if(!p1.phone.trim()&&!p2.phone.trim())return setMsg(["no","연락처를 하나 이상 입력하세요."]);
      const hap=num(p1.div)+num(p2.div);
      row={event:"double",name:p1.name.trim()+"·"+p2.name.trim(),org:p1.org.trim()+"/"+p2.org.trim(),
        div:"합"+hap+"부",phone:(p1.phone||p2.phone).trim(),
        meta:{p1:{name:p1.name.trim(),org:p1.org.trim(),div:p1.div,phone:p1.phone.trim()},
              p2:{name:p2.name.trim(),org:p2.org.trim(),div:p2.div,phone:p2.phone.trim()},hap:hap}};
    }else{
      if(!team.name.trim())return setMsg(["no","팀명을 입력하세요."]);
      const roster=r.filter(x=>x.name.trim()).map(x=>({name:x.name.trim(),div:x.div}));
      if(!roster.length)return setMsg(["no","선수 명단을 입력하세요."]);
      row={event:"team",name:team.name.trim(),org:team.name.trim(),div:team.div,phone:team.phone.trim(),meta:{roster:roster}};
    }
    setBusy(true);
    try{await addEntry(row);setMsg(["ok","신청이 접수되었습니다!"]);
      setName("");setOrg("");setPhone("");
      setP1({name:"",org:"",div:"1부",phone:""});setP2({name:"",org:"",div:"1부",phone:""});
      setTeam({name:"",div:"1부",phone:""});setR([{name:"",div:"1부"},{name:"",div:"1부"},{name:"",div:"1부"}]);
      await reload();
    }catch(e){setMsg(["no","오류가 발생했습니다. (관리자: DB에 meta 열이 있는지 확인)"]);}
    setBusy(false);
  };
  const hitPhone=e=>{const q=qp.trim();if(!q)return true;const m=e.meta||{};
    return (e.phone||"").includes(q)||(m.p1&&(m.p1.phone||"").includes(q))||(m.p2&&(m.p2.phone||"").includes(q));};
  const mine=(qn.trim()||qp.trim())?entries.filter(e=>(qn.trim()?e.name.includes(qn.trim()):true)&&hitPhone(e)):[];
  const cancel=async(id)=>{if(!confirm("이 신청을 취소할까요?"))return;await deleteEntry(id);await reload();};
  const Dsel=({v,on})=><select value={v} onChange={e=>on(e.target.value)}>{DIVS.map(d=><option key={d}>{d}</option>)}</select>;
  const hap=num(p1.div)+num(p2.div);
  return (<>
    <div className="card">
      <h2>참가 신청</h2>
      <div className="segs">{EVENTS.map(([k,t])=><button key={k} className={ev===k?"on":""} onClick={()=>setEv(k)}>{t}</button>)}</div>

      {ev==="single"&&<div className="grid">
        <input placeholder="이름" value={name} onChange={e=>setName(e.target.value)}/>
        <input placeholder="소속 (예: 종로소방서)" value={org} onChange={e=>setOrg(e.target.value)}/>
        <Dsel v={dv} on={setDv}/>
        <input placeholder="연락처" value={phone} onChange={e=>setPhone(e.target.value)}/>
      </div>}

      {ev==="double"&&<>
        <p className="muted" style={{fontSize:13,margin:"0 0 8px"}}>두 선수 정보를 각각 입력하세요. 합부수는 자동 계산됩니다.</p>
        {[["선수 1",p1,setP1],["선수 2",p2,setP2]].map(([lbl,s,set])=>(
          <div key={lbl} style={{border:"1px solid #eef2f7",borderRadius:8,padding:10,marginBottom:8}}>
            <div style={{fontSize:12,fontWeight:700,color:"#475569",marginBottom:6}}>{lbl}</div>
            <div className="grid">
              <input placeholder="이름" value={s.name} onChange={e=>set({...s,name:e.target.value})}/>
              <input placeholder="소속" value={s.org} onChange={e=>set({...s,org:e.target.value})}/>
              <Dsel v={s.div} on={v=>set({...s,div:v})}/>
              <input placeholder="연락처" value={s.phone} onChange={e=>set({...s,phone:e.target.value})}/>
            </div>
          </div>))}
        <span className="pill" style={{background:"#fee2e2",color:"#b91c1c",fontWeight:700}}>합부수 : 합{hap}부  ({p1.div} + {p2.div})</span>
      </>}

      {ev==="team"&&<>
        <div className="grid">
          <input placeholder="팀명 (예: 종로소방서)" value={team.name} onChange={e=>setTeam({...team,name:e.target.value})} style={{gridColumn:"1 / -1"}}/>
          <div style={{display:"flex",gap:6,alignItems:"center"}}><span className="muted" style={{fontSize:13,whiteSpace:"nowrap"}}>팀 부수</span><Dsel v={team.div} on={v=>setTeam({...team,div:v})}/></div>
          <input placeholder="대표 연락처" value={team.phone} onChange={e=>setTeam({...team,phone:e.target.value})}/>
        </div>
        <p className="muted" style={{fontSize:13,margin:"10px 0 6px"}}>선수 명단 (이름 · 부수)</p>
        {r.map((x,i)=><div key={i} className="grid" style={{marginBottom:6}}>
          <input placeholder={"선수 "+(i+1)} value={x.name} onChange={e=>{const c=[...r];c[i]={...c[i],name:e.target.value};setR(c);}}/>
          <Dsel v={x.div} on={v=>{const c=[...r];c[i]={...c[i],div:v};setR(c);}}/>
        </div>)}
      </>}

      <div style={{marginTop:12}}><button className="btn btn-p" disabled={busy} onClick={submit}>{busy?"접수 중…":"신청하기"}</button></div>
      {msg&&<div className={"msg "+(msg[0]==="ok"?"msg-ok":"msg-no")}>{msg[1]}</div>}
    </div>
    <div className="card">
      <h2>내 신청 조회 · 취소</h2>
      <div className="row"><input placeholder="이름/팀명" value={qn} onChange={e=>setQn(e.target.value)} style={{flex:1}}/><input placeholder="연락처" value={qp} onChange={e=>setQp(e.target.value)} style={{flex:1}}/></div>
      {(qn.trim()||qp.trim())&&(mine.length?
        <table style={{marginTop:12}}><thead><tr><th>종목</th><th>이름</th><th>부수</th><th></th></tr></thead>
        <tbody>{mine.map(e=><tr key={e.id}><td>{EVLABEL[e.event]}</td><td>{e.name}</td><td><span className="pill">{e.div}</span></td><td><button className="btn btn-sm btn-d" onClick={()=>cancel(e.id)}>취소</button></td></tr>)}</tbody></table>
        :<p className="muted" style={{marginTop:12}}>해당하는 신청이 없습니다.</p>)}
    </div>
    </>);
}

/* ---------- 대진표 보기 (참가자용) ---------- */
function PublicView({entries,states,reload}){

      <h2 style={{margin:0}}>대진표 보기</h2>
      <button className="btn btn-sm" onClick={reload}>🔄 새로고침</button>
    </div>
    <div className="segs" style={{marginTop:12}}>{EVENTS.map(([k,t])=><button key={k} className={ev===k?"on":""} onClick={()=>{setEv(k);setDv("");}}>{t}</button>)}</div>
    <h3 style={{marginTop:16}}>예선 리그</h3>
    {(st.groups||[]).length===0?<p className="muted">아직 조 편성 전입니다.</p>:

    {no&&<div className="msg msg-no">비밀번호가 올바르지 않습니다.</div>}
  </div>;
}
function Admin({entries,states,setStates,reload}){
  const [ev,setEv]=useState("single");
  const [tab,setTab]=useState("list");
  const [dv,setDv]=useState("");
  const [pmode,setPmode]=useState("prelim");
  const st=states[ev]||{advance:2}, byId={}; entries.forEach(e=>byId[e.id]=e);
  const evEntries=entries.filter(e=>e.event===ev);
  const adv=st.advance||2;
  const patch=async(nd)=>{setStates(s=>({...s,[ev]:nd}));try{await saveState(ev,nd);}catch(e){console.error(e);}};
  const tierMap=st.tierMap||{};
  const setTier=(d,v)=>patch({...st,tierMap:{...tierMap,[d]:v}});
  const applyPreset=(m)=>patch({...st,tierMap:m});
  const draw=()=>patch({...st,groups:makeGroups(evEntries,3,st.tierMap||{}),prelim:{},knockWinners:{},advance:adv});
  const toggleWin=(g,a,b)=>{const key=pKey(g,a,b);const np={...(st.prelim||{})};if(np[key]===a)delete np[key];else np[key]=a;patch({...st,prelim:np});};
  const divs=divsOf(st), activeDiv=dv||divs[0]||"";
  const setKnock=(mid,pid)=>{const r=parseInt(mid.match(/^r(\d+)/)[1]),cur=(st.knockWinners||{})[activeDiv]||{},nw={};
    Object.keys(cur).forEach(k=>{if(parseInt(k.match(/^r(\d+)/)[1])<=r)nw[k]=cur[k];});nw[mid]=pid;
    patch({...st,knockWinners:{...(st.knockWinners||{}),[activeDiv]:nw}});};
  const togglePaid=async(e)=>{await updateEntry(e.id,{paid:!e.paid});await reload();};
  const del=async(id)=>{if(!confirm("이 참가자를 삭제할까요?"))return;await deleteEntry(id);await reload();};
  const ADMTABS=[["list","신청현황"],["group","조편성·예선"],["knock","본선"],["print","출력"]];
  return (<>
    <div className="segs no-print">{EVENTS.map(([k,t])=><button key={k} className={ev===k?"on":""} onClick={()=>{setEv(k);setDv("");}}>{t}</button>)}</div>
    <div className="tabs no-print">{ADMTABS.map(([k,t])=><button key={k} className={tab===k?"on":""} onClick={()=>setTab(k)}>{t}</button>)}
      <button className="btn btn-sm" style={{marginLeft:"auto"}} onClick={reload}>🔄 새로고침</button></div>

    {tab==="list"&&<div className="card">
      <h2>{EVLABEL[ev]} 신청현황 ({evEntries.length})</h2>
      {evEntries.length===0?<p className="muted">신청자가 없습니다.</p>:
      <table><thead><tr><th>#</th><th>이름</th><th>소속</th><th>부수</th><th>연락처</th><th>입금</th><th></th></tr></thead>
      <tbody>{evEntries.map((e,i)=><tr key={e.id}>
        <td className="muted">{i+1}</td>
        <td>{e.name}
          {e.event==="double"&&e.meta&&e.meta.p1&&<div className="muted" style={{fontSize:11}}>{e.meta.p1.name}({e.meta.p1.div}{e.meta.p1.org?"·"+e.meta.p1.org:""}{e.meta.p1.phone?"·"+e.meta.p1.phone:""}) / {e.meta.p2.name}({e.meta.p2.div}{e.meta.p2.org?"·"+e.meta.p2.org:""}{e.meta.p2.phone?"·"+e.meta.p2.phone:""})</div>}
          {e.event==="team"&&e.meta&&e.meta.roster&&<div className="muted" style={{fontSize:11}}>{e.meta.roster.map(x=>x.name+"("+x.div+")").join(", ")}</div>}
        </td>
        <td>{e.event==="team"?"-":e.org||"-"}</td>
        <td><span className="pill">{e.div}</span></td><td className="muted">{e.phone||"-"}</td>
        <td><button className={"btn btn-sm "+(e.paid?"btn-p":"")} onClick={()=>togglePaid(e)}>{e.paid?"완료":"미납"}</button></td>
        <td><button className="btn btn-sm btn-d" onClick={()=>del(e.id)}>삭제</button></td>
      </tr>)}</tbody></table>}
    </div>}

    {tab==="group"&&<>
      <div className="card no-print">
        <h3>부수 통합 설정</h3>
        <p className="muted" style={{fontSize:13,margin:"0 0 8px"}}>같은 이름을 적은 부수끼리 하나로 통합되어 조편성·본선이 함께 진행됩니다. 변경 후 [자동 조 편성]을 다시 누르세요.</p>
        <div className="tabs">
          <button onClick={()=>applyPreset({})}>부수별 개별</button>
          <button onClick={()=>applyPreset(Object.fromEntries(DIVS.map(d=>[d,"전체 통합"])))}>전체 통합</button>
          <button onClick={()=>applyPreset({"1부":"1~3부","2부":"1~3부","3부":"1~3부","4부":"4~6부","5부":"4~6부","6부":"4~6부"})}>1~3 / 4~6</button>
          <button onClick={()=>applyPreset({"4부":"4~6부","5부":"4~6부","6부":"4~6부"})}>4~6부 통합</button>
          <button onClick={()=>applyPreset({"5부":"5·6부","6부":"5·6부"})}>5~6부 통합</button>
        </div>
        <div className="grid" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
          {DIVS.map(d=><div key={d} style={{display:"flex",alignItems:"center",gap:6}}>
            <span className="pill" style={{minWidth:34,textAlign:"center"}}>{d}</span>
            <input value={tierMap[d]||d} onChange={e=>setTier(d,e.target.value)} style={{fontSize:13,padding:"6px 8px"}}/>
          </div>)}
        </div>
        <p className="muted" style={{fontSize:12,margin:"8px 0 0"}}>현재 통합부: {[...new Set(DIVS.map(d=>tierOf(tierMap,d)))].join("  ·  ")}</p>
      </div>
      <div className="card no-print"><div className="row">
        <label>본선 진출&nbsp;
          <select value={adv} onChange={e=>patch({...st,advance:Number(e.target.value)})}>
            <option value={1}>조 1위</option><option value={2}>조 2명</option><option value={3}>전원 통과</option>
          </select></label>
        <button className="btn btn-p" onClick={draw}>자동 조 편성</button>
        <span className="muted" style={{fontSize:13}}>통합부별 3명씩 자동 배정 · 교차표에서 결과 입력</span>
      </div></div>
      {(st.groups||[]).length===0?<div className="card"><p className="muted">먼저 조를 편성하세요.</p></div>:
      <div className="g2">{st.groups.map(g=><div className="card" key={g.id}><div className="scroll">
        <Matrix group={g} prelim={st.prelim||{}} byId={byId} adv={adv} onSet={toggleWin}/>
      </div></div>)}</div>}
    </>}

    {tab==="knock"&&<div className="card">
      {divs.length===0?<p className="muted">먼저 예선을 진행하세요.</p>:<>
        <div className="tabs no-print">{divs.map(d=><button key={d} className={activeDiv===d?"on":""} onClick={()=>setDv(d)}>{d}</button>)}</div>
        {(()=>{const rounds=buildRounds(advancersOf(st,activeDiv,byId),(st.knockWinners||{})[activeDiv]||{});return rounds.length?<Bracket rounds={rounds} winners={(st.knockWinners||{})[activeDiv]||{}} onPick={setKnock}/>:<p className="muted">진출자가 2 이상 필요합니다.</p>;})()}
      </>}
    </div>}

    {tab==="print"&&<>
      <div className="tabs no-print">
        <button className={pmode==="prelim"?"on":""} onClick={()=>setPmode("prelim")}>예선 결과지</button>
        <button className={pmode==="knock"?"on":""} onClick={()=>setPmode("knock")}>본선 대진표</button>
        <button className="btn btn-p btn-sm" style={{marginLeft:"auto"}} onClick={()=>window.print()}>인쇄 / PDF 저장</button>
      </div>
      <div className="card">
        <h2 style={{textAlign:"center"}}>서울소방 탁구동호회 대회 · {EVLABEL[ev]} {pmode==="prelim"?"예선 결과지":"본선 대진표"}</h2>
        {pmode==="prelim"
          ? <PrelimSheet state={st} byId={byId} evLabel={EVLABEL[ev]}/>
          : (divs.length===0?<p className="muted" style={{textAlign:"center"}}>본선 대진이 없습니다.</p>
             : divs.map(d=>{const rounds=buildRounds(advancersOf(st,d,byId),(st.knockWinners||{})[d]||{});
               return <div key={d} style={{marginBottom:24}}>
                 <h3 style={{borderLeft:"4px solid #d32f2f",paddingLeft:8}}>{d} 본선 토너먼트</h3>
                 {rounds.length?<Bracket rounds={rounds} winners={(st.knockWinners||{})[d]||{}} readOnly/>:<p className="muted">진출자 부족</p>}
               </div>;}))}
      </div>
    </>}
  </>);
}
